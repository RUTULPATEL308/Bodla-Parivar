workflows:
  ios-simulator-appetize:
    name: iOS Simulator -> Appetize
    instance_type: mac_mini_m2
    max_build_duration: 90
    environment:
      groups:
        - appetize   # APPETIZE_API_TOKEN (+ optional APPETIZE_IOS_PUBLIC_KEY). Add your Supabase vars here too if the app needs them.
      java: 17
      xcode: latest
    triggering:
      events:
        - push
      branch_patterns:
        - pattern: main
          include: true
    cache:
      cache_paths:
        - $HOME/.gradle/caches
        - $HOME/.gradle/wrapper
        - $HOME/.konan
    scripts:
      - name: Make gradlew executable
        script: chmod +x ./gradlew
      - name: Build iOS app for simulator
        script: |
          xcodebuild build \
            -project iosApp/iosApp.xcodeproj \
            -scheme iosApp \
            -configuration Debug \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath iosApp/build \
            CODE_SIGNING_ALLOWED=NO
      - name: Zip .app for Appetize
        script: |
          APP_PATH=$(find iosApp/build/Build/Products -name "*.app" -path "*iphonesimulator*" | head -n 1)
          echo "Found app: $APP_PATH"
          [ -z "$APP_PATH" ] && echo "No .app found" && exit 1
          cd "$(dirname "$APP_PATH")"
          zip -r "$CM_BUILD_DIR/app-simulator.zip" "$(basename "$APP_PATH")"
      - name: Upload to Appetize
        script: |
          if [ -n "$APPETIZE_IOS_PUBLIC_KEY" ]; then
            URL="https://api.appetize.io/v1/apps/$APPETIZE_IOS_PUBLIC_KEY"
          else
            URL="https://api.appetize.io/v1/apps"
          fi
          curl --fail -X POST "$URL" \
            -H "X-API-KEY: $APPETIZE_API_TOKEN" \
            -F "file=@$CM_BUILD_DIR/app-simulator.zip" \
            -F "platform=ios" | tee appetize_response.json
    artifacts:
      - app-simulator.zip
      - appetize_response.json

  android-appetize:
    name: Android APK -> Appetize
    instance_type: linux_x2
    max_build_duration: 60
    environment:
      groups:
        - appetize   # APPETIZE_API_TOKEN (+ optional APPETIZE_ANDROID_PUBLIC_KEY)
      java: 17
    triggering:
      events:
        - push
      branch_patterns:
        - pattern: main
          include: true
    cache:
      cache_paths:
        - $HOME/.gradle/caches
        - $HOME/.gradle/wrapper
    scripts:
      - name: Build debug APK
        script: |
          chmod +x ./gradlew
          ./gradlew :composeApp:assembleDebug
      - name: Upload to Appetize
        script: |
          APK_PATH=$(find composeApp/build/outputs/apk/debug -name "*.apk" | head -n 1)
          echo "Found APK: $APK_PATH"
          if [ -n "$APPETIZE_ANDROID_PUBLIC_KEY" ]; then
            URL="https://api.appetize.io/v1/apps/$APPETIZE_ANDROID_PUBLIC_KEY"
          else
            URL="https://api.appetize.io/v1/apps"
          fi
          curl --fail -X POST "$URL" \
            -H "X-API-KEY: $APPETIZE_API_TOKEN" \
            -F "file=@$APK_PATH" \
            -F "platform=android" | tee appetize_response.json
    artifacts:
      - composeApp/build/outputs/apk/debug/*.apk
      - appetize_response.json
